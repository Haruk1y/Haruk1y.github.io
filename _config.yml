title: Haruki Yajima - 矢島陽樹
description: M.S. student at The University of Tokyo researching AI safety and trustworthy AI.
url: https://haruk1y.github.io
baseurl: ""
repository: Haruk1y/Haruk1y.github.io
timezone: Asia/Tokyo

author:
  name: Haruki Yajima / 矢島陽樹
  avatar: /assets/img/haruki_profile.png
  bio: The University of Tokyo
  location: Tokyo, Japan
  email: yajima.code@gmail.com
  googlescholar: https://scholar.google.com/citations?user=AJD7xnQAAAAJ
  github: Haruk1y
  linkedin: haruki-yajima
  twitter: Haruk1y_

include: [_pages]
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - bin
  - Dockerfile
  - docker-compose*.yml
  - package*.json
  - node_modules
  - vendor
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap
